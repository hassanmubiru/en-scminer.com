# fly.toml — SCMiner API on Fly.io
app = "scminer-api"
primary_region = "iad"   # Washington DC — change to nearest: lhr=London, fra=Frankfurt, sin=Singapore

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST     = "0.0.0.0"
  PORT     = "3000"
  # DATABASE_URL is set as a secret via fly secrets set

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus     = 1

[checks]
  [checks.health]
    grace_period = "10s"
    interval     = "30s"
    method       = "GET"
    path         = "/health"
    port         = 3000
    timeout      = "5s"
    type         = "http"
