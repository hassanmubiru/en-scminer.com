services:
  - type: web
    name: scminer-api
    env: node
    region: oregon
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: scminer-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false          # Set manually in Render dashboard → your Vercel URL
      - key: CRYPTO_PAYMENT_EXPIRY_MINUTES
        value: 30
      - key: COINGECKO_API_KEY
        sync: false
      - key: ETH_RPC_URL
        sync: false
      - key: TRON_API_URL
        value: https://api.trongrid.io

databases:
  - name: scminer-db
    plan: free
    databaseName: scminer
    user: scminer
